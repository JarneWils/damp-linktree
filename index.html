<!DOCTYPE html>

<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<title>D A M P | Links</title>

<style>

    @font-face {
        font-family: gothic;
        src: url("assets/Dbacks.ttf");
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #fff;

        /* background:
            radial-gradient(
                circle at top,
                rgb(0, 0, 0) 0%,
                rgb(0, 0, 0) 45%,
                hsl(0, 0%, 0%) 85%
            ); */

        background-color: black;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 620px;
    }

    /* =========================
       BANNER / PROFIEL
    ========================= */

    .profile {
        margin-bottom: 30px;
    }

    .profile-banner {
        position: relative;
        width: 100%;
        height: 320px;

        overflow: hidden;

        background: #222;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.35);

        margin-bottom: 45px;
    }

    .banner-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;

        transition: transform 0.5s ease;
    }

    .banner-video {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;

        display: block;
    }


    /* Donkere gradient onderaan de afbeelding */
    .profile-banner::after {
        content: "";

        position: absolute;
        left: 0;
        right: 0;
        bottom: -2px;

        height: 85%;

        background: linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.15) 25%,
            rgba(0, 0, 0, 0.45) 55%,
            rgba(0, 0, 0, 0.85) 80%,
            #000 100%
        );

        pointer-events: none;

        z-index: 1;
    }

    .profile-logo {
        position: absolute;

        left: 25%;
        bottom: -25px;

        width: 260px;
        height: auto;

        z-index: 3;

        transform: translateX(-50%);

        object-fit: contain;

        filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.6));
    }


    /* Naam onderaan de banner */
    .profile-name {
        position: absolute;
        left: 35px;
        bottom: 18px;
        z-index: 2;
        color: white;
        font-family: 'gothic';
        font-size: 35px;
    }

    .description {
        margin-top: 14px;

        color: #797979;

        font-size: 15px;
        text-align: center;
    }


    /* =========================
       LINKS
    ========================= */

    .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .link {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;

        min-height: 62px;
        padding: 15px 55px;

        border-radius: 16px;

        color: white;
        text-decoration: none;

        font-size: 16px;
        font-weight: 600;

        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        transition:
            transform 0.25s ease,
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease;
    }

    .link:hover {
        transform: translateY(-3px) scale(1.01);

        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.25);

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .icon {
        position: absolute;
        left: 20px;

        width: 24px;
        height: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;
    }

    .arrow {
        position: absolute;
        right: 20px;

        color: #fafafa;
        font-size: 18px;

        transition: transform 0.25s ease;
    }

    .link:hover .arrow {
        transform: translateX(4px);
        color: white;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        margin-top: 18vh;

        color: rgb(82, 82, 82);
        opacity: 0.8;

        font-size: 13px;
        text-align: center;
    }


    /* =========================
       MOBIEL
    ========================= */

    @media (max-width: 500px) {

        body {
            padding: 0px 0px;
        }
        .links{
            padding: 0px 20px;
        }
        footer {
            margin-top: 20vh;
        }
        .profile-banner{    
            height: 260px;
        }

        .profile-name {
            left: 18px;
            bottom: 15px;

            font-size: 25px;
            letter-spacing: 2px;
        }
        .profile-logo {
            width: 220px;
            bottom: -25px;
            left: 125px;
        }

        .description {
            margin-top: 12px;
        }

        .link {
            min-height: 58px;
            border-radius: 14px;
        }
    }
</style>


</head>

<main class="container">

    <!-- LINKS -->
